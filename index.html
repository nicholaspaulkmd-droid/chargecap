<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ChargeCap</title>
<meta name="theme-color" content="#0f4c5c" />
<meta name="description" content="Surgical charge capture — CPT/ICD-10 coding, OCR sticker scan, billing status, Microsoft 365 (OneDrive Excel) sync." />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ChargeCap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<!-- idb-keyval: tiny IndexedDB wrapper (UMD build, works offline once cached by the service worker) -->
<script src="https://unpkg.com/idb-keyval@6/dist/umd.js"></script>
<!-- Tesseract.js: on-device OCR, no server required -->
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<!-- MSAL.js 3.30.0 (Microsoft sign-in), bundled with the app so it is cached for offline use -->
<script src="msal-browser.min.js"></script>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
